[package]
name = "attune-eq"
description = "Headphone correction curves for the GoXLR's output buses, applied through Equalizer APO."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
log = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# Spatial audio is read and set through WinRT (Media_Audio) and the endpoint
# list comes from Core Audio (Win32_Media_Audio), so both halves are needed.
[target.'cfg(windows)'.dependencies]
# Reading Equalizer APO's own registration and the endpoints' effect chains,
# to tell whether APO is still in the audio path.
winreg = { workspace = true }
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    # Detecting whether Dolby Access / DTS Sound Unbound are installed, so a
    # format that cannot work is not offered.
    "ApplicationModel",
    "Management_Deployment",
    "Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    # IPropertyStore::GetValue -- the endpoint's friendly name -- is gated on
    # these two, because it hands back a PROPVARIANT.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
