<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attune</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #23272f;
    --line: #2e333c;
    --text: #e6e9ef;
    --dim: #949cab;
    --accent: #4da3ff;
    --ok: #46c98b;
    --warn: #e8b44a;
    --crit: #ec6a5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 0 0 14px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .row { display: flex; justify-content: space-between; gap: 12px;
         border-bottom: 1px solid var(--line); padding: 6px 0; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--dim); }
  .row .v { font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { color: var(--dim); font-size: 13px; }
  select, input[type=number] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font: inherit; font-size: 14px;
  }
  button {
    background: var(--accent); color: #07121e; border: 0;
    border-radius: 6px; padding: 10px 16px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--crit); color: #2a0b07; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 10px; }
  .rec { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--crit);
         animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .bar { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .change { border-left: 3px solid var(--accent); background: var(--panel-2);
            border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 10px; }
  .change .t { font-weight: 600; margin-bottom: 4px; }
  .change .why { color: var(--dim); font-size: 13.5px; }
  .note { border-left: 3px solid var(--warn); background: var(--panel-2);
          border-radius: 0 8px 8px 0; padding: 12px 14px; margin-bottom: 10px;
          color: var(--dim); font-size: 13.5px; }
  .finding { border-left: 3px solid var(--line); background: var(--panel-2);
             border-radius: 0 8px 8px 0; padding: 10px 14px; margin-bottom: 8px; }
  .finding.CRIT { border-left-color: var(--crit); }
  .finding.WARN { border-left-color: var(--warn); }
  .finding.INFO { border-left-color: var(--accent); }
  .finding .t { font-weight: 600; font-size: 14px; }
  .finding .d { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .err { border-left: 3px solid var(--crit); background: var(--panel-2);
         border-radius: 0 8px 8px 0; padding: 12px 14px; color: var(--crit); }
  .ok { color: var(--ok); }
  .hidden { display: none; }
  .applied li { margin-bottom: 4px; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Attune</h1>
  <div class="sub">Measurement-based tuning for your GoXLR microphone.</div>

  <div class="card">
    <h2>Device</h2>
    <div id="device">Loading…</div>
  </div>

  <div class="card" id="findings-card">
    <h2>Current chain</h2>
    <div id="findings"></div>
  </div>

  <div class="card">
    <h2>Tune</h2>
    <div class="controls">
      <label for="target">Target</label>
      <select id="target"></select>

      <label for="seconds">Record</label>
      <input id="seconds" type="number" min="5" max="60" value="15" style="width:74px">
      <span style="color:var(--dim);font-size:13px">seconds</span>

      <label for="device-select">Input</label>
      <select id="device-select"></select>
    </div>

    <div class="controls" style="margin-top:14px">
      <button id="measure">Measure only</button>
      <button id="apply" class="ghost">Measure and apply</button>
    </div>

    <div class="hint">
      <strong>Measure only</strong> changes nothing. Speak normally for the whole
      recording — it starts the moment you press the button and does not wait for you.
    </div>

    <div class="rec hidden" id="rec">
      <span class="dot"></span>
      <strong id="rec-label">Recording — speak now</strong>
      <span class="bar"><i id="rec-bar"></i></span>
      <span id="rec-count" style="font-variant-numeric:tabular-nums;color:var(--dim)"></span>
    </div>
  </div>

  <div class="card hidden" id="results-card">
    <h2>Result</h2>
    <div id="results"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let busy = false;

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({ error: 'Bad response from daemon' }));
  if (!r.ok || body.error) throw new Error(body.error || ('HTTP ' + r.status));
  return body;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function row(k, v) {
  return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
}

async function loadState() {
  try {
    const s = await getJSON('/api/attune/state');
    const c = s.chain;
    $('device').innerHTML = `<div class="grid">
      ${row('Model', s.device_type)}
      ${row('Serial', s.serial)}
      ${row('Profile', s.profile)}
      ${row('Mic type', c.mic_type)}
      ${row('Preamp gain', c.gain_db + ' dB')}
      ${row('Gate threshold', c.gate_threshold_db + ' dB')}
      ${row('Compressor threshold', c.compressor_threshold_db + ' dB')}
      ${row('Compressor ratio', c.compressor_ratio)}
    </div>`;

    $('findings').innerHTML = s.findings.length
      ? s.findings.map(f => `<div class="finding ${esc(f.severity)}">
          <div class="t">${esc(f.stage)} — ${esc(f.summary)}</div>
          <div class="d">${esc(f.detail)}</div></div>`).join('')
      : '<div class="ok">No findings. The chain is coherently configured.</div>';
  } catch (e) {
    $('device').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    $('findings-card').classList.add('hidden');
  }
}

async function loadTargets() {
  try {
    const ts = await getJSON('/api/attune/targets');
    $('target').innerHTML = ts.map(t =>
      `<option value="${esc(t.name)}">${esc(t.name)} — ${esc(t.description)}</option>`).join('');
  } catch (e) { /* the tune call will report it */ }
}

async function loadDevices() {
  try {
    const ds = await getJSON('/api/attune/devices');
    const preferred = ds.find(d => /chat mic/i.test(d)) || ds[0];
    $('device-select').innerHTML = ds.map(d =>
      `<option ${d === preferred ? 'selected' : ''}>${esc(d)}</option>`).join('');
  } catch (e) { /* ignore */ }
}

function countdown(seconds) {
  $('rec').classList.remove('hidden');
  const started = Date.now();
  return setInterval(() => {
    const elapsed = (Date.now() - started) / 1000;
    const pct = Math.min(100, (elapsed / seconds) * 100);
    $('rec-bar').style.width = pct + '%';
    const left = Math.max(0, Math.ceil(seconds - elapsed));
    $('rec-count').textContent = left + 's';
    if (left === 0) $('rec-label').textContent = 'Analysing…';
  }, 100);
}

function renderResult(res, didApply) {
  const m = res.measurement, rec = res.recommendation;
  let html = '';

  if (!res.usable) {
    html += `<div class="err">${esc(res.usability)}</div>`;
    $('results').innerHTML = html;
    $('results-card').classList.remove('hidden');
    return;
  }

  html += `<div class="grid" style="margin-bottom:16px">
    ${row('Speech level', m.speech_level_dbfs.toFixed(1) + ' dBFS')}
    ${row('Noise floor', m.noise_floor_dbfs.toFixed(1) + ' dBFS')}
    ${row('Peak', m.peak_dbfs.toFixed(1) + ' dBFS')}
    ${row('Signal to noise', m.signal_to_noise_db.toFixed(1) + ' dB')}
    ${row('Crest factor', m.crest_factor_db.toFixed(1) + ' dB')}
    ${row('Speech frames', m.speech_frames + ' of ' + m.total_frames)}
  </div>`;

  if (rec.changes.length) {
    html += rec.changes.map(c => `<div class="change">
      <div class="t">${esc(c.setting)}: ${esc(c.from)} → ${esc(c.to)}</div>
      <div class="why">${esc(c.reason)}</div></div>`).join('');
  } else {
    html += `<div class="ok" style="margin-bottom:10px">Nothing to change — the chain already matches this target.</div>`;
  }

  html += rec.notes.map(n => `<div class="note">${esc(n)}</div>`).join('');

  if (didApply && res.applied) {
    html += '<div class="applied" style="margin-top:14px"><ul>';
    html += res.applied.confirmed.map(c =>
      `<li class="ok">Confirmed on device: ${esc(c)}</li>`).join('');
    html += res.applied.failed.map(f =>
      `<li style="color:var(--crit)">Failed: ${esc(f.setting)} — ${esc(f.reason)}</li>`).join('');
    html += '</ul></div>';
    if (rec.needs_remeasure) {
      html += `<div class="note">Level has changed, so that measurement no longer
        describes this chain. Run it again to place the gate and compressor against
        the corrected signal.</div>`;
    }
  } else if (rec.changes.length) {
    html += `<div class="hint">Nothing was written. Use <strong>Measure and apply</strong> to make these changes.</div>`;
  }

  $('results').innerHTML = html;
  $('results-card').classList.remove('hidden');
}

async function run(shouldApply) {
  if (busy) return;
  busy = true;
  $('measure').disabled = $('apply').disabled = true;
  $('results-card').classList.add('hidden');
  $('rec-label').textContent = 'Recording — speak now';
  $('rec-bar').style.width = '0%';

  const seconds = Math.max(5, Math.min(60, parseInt($('seconds').value, 10) || 15));
  const timer = countdown(seconds);

  try {
    const res = await getJSON('/api/attune/tune', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        seconds,
        target: $('target').value,
        device: $('device-select').value,
        apply: shouldApply
      })
    });
    renderResult(res, shouldApply);
    if (shouldApply) loadState();
  } catch (e) {
    $('results').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    $('results-card').classList.remove('hidden');
  } finally {
    clearInterval(timer);
    $('rec').classList.add('hidden');
    $('measure').disabled = $('apply').disabled = false;
    busy = false;
  }
}

$('measure').onclick = () => run(false);
$('apply').onclick = () => run(true);

loadState();
loadTargets();
loadDevices();
</script>
</body>
</html>
