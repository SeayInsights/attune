# Attune-specific CI.
#
# Kept separate from the inherited build.yml on purpose. Upstream's workflow
# already runs check/fmt/clippy across Linux, macOS and Windows; duplicating it
# here would only create merge conflicts every time upstream touches it.
#
# This workflow covers the two things upstream does not: the actual release
# build, and the test suite. Windows only, because that is the only platform
# Attune's routing and EQ layers target.

name: Attune CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test_windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Preparing Cache..
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --workspace

  linux_graph:
    name: No desktop toolkit in the Linux graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the resolved Linux dependency graph
        run: bash ci/check-linux-graph.sh

  release_workflow:
    name: Release workflow invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Check what can publish a release
        run: python ci/check-release-workflow.py
