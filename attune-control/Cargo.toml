[package]
name = "attune-control"
description = "Typed client for the Attune daemon control API: reads and writes GoXLR device state."
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
log = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

goxlr-ipc = { path = "../ipc" }
# serde feature: MicChain is serialised to the Attune web UI, and its typed
# mic_type and compressor_ratio come from this crate.
goxlr-types = { path = "../types", features = ["serde"] }

[[bin]]
name = "attune-check"
path = "src/bin/attune_check.rs"
